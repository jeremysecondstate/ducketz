[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ducketz"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "hyperliquid-python-sdk>=0.16.0",
    "eth-account>=0.13.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "python-dateutil>=2.9.0",
    "pyarrow>=16.0.0",
    "exchange-calendars",
    "filelock>=3.16",
    "databento>=0.81,<1",
]

[project.scripts]
ducketz-option-pricing = "ml.option_pricing_runtime:main"
ducketz-opra-sync = "ml.option_pricing_opra:main"
ducketz-options-history = "datafetching.options_history:main"
ducketz-databento-cold-start = "datafetching.databento_cold_start:main"
ducketz-equity-dataset-migration = "datafetching.equity_dataset_migration:main"
ducketz-opra-pricing-replay = "ml.option_pricing_opra_replay:main"
ducketz-option-pricing-fred = "ml.option_pricing_fred:main"
ducketz-fred-alfred-runtime = "datafetching.fred_alfred_runtime:main"
ducketz-macro-ablation = "ml.macro_ablation:main"
ducketz-option-pricing-admin = "ml.option_pricing_admin:main"
ducketz-option-pricing-lockbox = "ml.option_pricing_lockbox:main"
ducketz-option-pricing-loop-native = "ml.option_pricing_loop_native_worker:main"
ducketz-system-monitor = "ml.system_monitor:main"
ducketz-system-guardian = "ml.system_guardian:main"
ducketz-scheduler-handoff = "ml.scheduler_handoff:main"
ducketz-strategy-profit-training = "ml.strategy_profit_training_runtime:main"
ducketz-strategy-value-challenger = "ml.strategy_value_challenger:main"
ducketz-sequence-encoder = "ml.sequence_encoder.runtime:main"
ducketz-sequence-preregistration = "ml.sequence_encoder.preregistration_proposal:main"
ducketz-sequence-inference = "ml.sequence_encoder.inference_runtime:main"
ducketz-loop-c-observe = "ml.loop_c.runtime:main"
ducketz-loop-c-schwab-snapshot = "ml.loop_c.schwab_snapshot:main"
ducketz-loop-c-risk-proposal = "ml.loop_c.risk_proposal:main"
ducketz-loop-c-weekly-review = "ml.loop_c.weekly_review:main"

[project.optional-dependencies]
options-chat = [
    "openai>=2.45.0,<3",
]
ml = [
    "scikit-learn>=1.7",
    "joblib>=1.4",
    "scipy>=1.11",
]
ml-tree = [
    "lightgbm>=4.3,<5",
    "xgboost>=2.1,<4",
]
ml-sequence = [
    "torch>=2.13,<2.14",
]
ml-test = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = [
    "app*",
    "datafetching*",
    "fundamentals*",
    "options*",
    "signals*",
    "technicals*",
    "ml*",
]

[tool.setuptools.package-data]
"app.ui" = [
    "assets/security_marks/*.png",
    "assets/security_marks/*.md",
]
