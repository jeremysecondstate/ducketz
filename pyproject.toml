[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ducketz"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "hyperliquid-python-sdk>=0.16.0",
    "eth-account>=0.13.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "python-dateutil>=2.9.0",
    "pyarrow>=16.0.0",
    "exchange-calendars",
    "filelock>=3.16",
    "databento>=0.81,<1",
]

[project.scripts]
ducketz-option-pricing = "ml.option_pricing_runtime:main"
ducketz-option-pricing-opra = "ml.option_pricing_opra:main"
ducketz-option-pricing-fred = "ml.option_pricing_fred:main"
ducketz-option-pricing-admin = "ml.option_pricing_admin:main"
ducketz-option-pricing-lockbox = "ml.option_pricing_lockbox:main"
ducketz-option-pricing-loop-native = "ml.option_pricing_loop_native_worker:main"

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "scipy>=1.11",
]
ml-tree = [
    "lightgbm>=4.3,<5",
    "xgboost>=2.1,<4",
]
ml-test = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = [
    "app*",
    "datafetching*",
    "fundamentals*",
    "options*",
    "signals*",
    "technicals*",
    "ml*",
]
