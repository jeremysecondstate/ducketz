prompt = "Perform a bounded weekday pre-opening check of the user's Ducketz Gameplan trader at 03:55 Pacific. This task no longer stays active until 17:00 or polls every minute. The native trader manages its own continuous session; Loops Operations Watch supplies recurring 90-minute checks. Finish promptly after the check or narrow diagnosis.\n\nUse C:/dev/ducketz and C:/DATASTORE, America/Los_Angeles, and the native XNYS calendar. Read only the newest relevant section of this task's memory first. The current operating contracts are C:/dev/ducketz/docs/loops-system-analysis/INDEPENDENT_STOCK_HORIZONS.md and NIGHTLY_GAMEPLAN.md. On routine healthy wakes, use saved contract/version notes; read the relevant current sections when policy, source or incident state changes. Current membership comes from datafetching/watchlist.txt; historical artifacts keep their own saved universes.\n\nPreserve the user's active gameplan-direction-current-market-v1 worker, exact launcher/child identity, session lock and recorded policy. The current manual strategy buys new bullish forecasts and accumulates shares, and sells on bearish forecasts within each horizon. Forecast target ends score outcomes and do not trigger automatic liquidation. Respect the dated YG deployment selection, per-forecast order identities, actual broker cash/holdings, pending reservations and current quote rules. Planning projections are informational. Do not reintroduce legacy fixed-policy sizing, expiry sales, 46–54% thresholds, redundant execution model gates or the expired September 14 exceptions. Read the saved forecast's own versioned contract rather than inventing another policy.\n\nEnabling these monitors does not enable the disabled legacy Windows launcher or authorize another live worker, trading-control change or direct order action. The user starts the live session. Preserve the authorized single owner. Never submit, cancel or replace orders, clear reservations or credentials, delete locks, repeat uncertain submissions, replay consumed forecasts, retrain intraday, alter risk/model gates or restart retired loops.\n\nInspect C:/DATASTORE/state/independent-stock-trader/session-status.json, the exact ml.gameplan_stock_trader launcher/child commands and creation times, session lock, and bounded recent native launcher/stdout/stderr evidence. The expected user-selected command includes --execute --target-horizon all --sizing-policy gameplan-direction-current-market-v1 --run-session and optional --wait-for-open. Confirm one matching process tree. A healthy waiting worker reports the next supported action_date, wakes_at 04:00 Pacific and a fresh heartbeat, with no broker/model/inventory/entry-slot activity while asleep. It wakes automatically; the first normal entry is 04:01 and the broker transition is 13:06. The native session ends at 17:00; the manual strategy has no forced expiry liquidation.\n\nIf already inside the supported session, inspect the latest actual cycle: CURRENT/CURRENT_AFTER_RETRY with no error establishes successful broker capture. A live PID or heartbeat alone does not clear DEGRADED/FAILED status. A missing worker with intentionally disabled controls is intentional; a worker expected by the user's enabled session but absent, mismatched, stale, still sleeping after wake, or failing is actionable. Report it with exact paths. Do not launch another worker or enable the disabled Windows task. User authorization for a prior one-time repair is not a standing order to start future sessions.\n\nUse cached verification when source identity and state are unchanged. Read only a few relevant log entries; avoid routine broker/provider calls, database audits, full receipt rehashing, model checks, full history reads or broad delegation. For a concrete incident, read the relevant current procedures and coordinate with Operations Watch. Acquire a fresh supervision UUID through ml.overnight_runtime before any authorized repair; proceed only on ACQUIRED, renew during work and release afterward. Do not duplicate another owner's intervention. Preserve failed evidence and report a specific blocker when action is outside the standing monitoring scope.\n\nRead the concise current-state notes in memory, then append only new findings and the run time. Acknowledge intentionally waiting/healthy state briefly; surface actionable failures clearly."
