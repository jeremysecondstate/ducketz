prompt = "Latest explicit operator correction, September 14, 2026, for all eleven symbols in the user-selected Gameplan policy (this supersedes conflicting older Gameplan restrictions below): Execute published Gameplan directions using current Schwab cash, eligible holdings and quotes, with the existing horizon allocation limits. Gameplan startup and entry execution no longer rerun model promotion, training artifacts, manifest checksums, receipt checksums or research-contract validation. Do not restore those redundant execution vetoes. Premarket creation of a forecast does not restrict its later scheduled execution to the premarket broker session. A newly fetched realtime NBBO response remains current even when the bid/ask update timestamp is unchanged; retain both provider update and HTTP receipt times. Wide spreads may use the authorized midpoint limit. Planning price and cash are estimates, never execution limits. Preserve the planned prices and record the fetched bid/ask midpoint, timestamps, limit and actual quantity beside them for all symbols; missing comparison data is informational. Gameplan rechecks unfinished instructions during their scheduled action hour, bounded by the original holding target; an empty hourly attempt claim cannot permanently consume a failed quote/read attempt. Durable forecast allocations and actual order reservations prevent duplicate or uncertain resubmissions. Read the current INDEPENDENT_STOCK_HORIZONS.md and the latest automation memory. The user performs live starts/restarts; supervisors do not submit orders or restart the trading worker. Legacy fixed-policy behavior and the existing Windows launch schedule remain separate.\n\nResearch onboarding completion and recovery contract (September 14, 2026): Use docs/loops-system-analysis/RESEARCH_SYMBOL_ONBOARDING.md and the current production watchlist. The CROX/PATH/TWST/IONQ batch has its own activation.json; trust verified ACTIVE membership, never an earlier seven-symbol assumption. The reusable workflow now finishes with `research_onboarding finalize --plan ...` after a completed native attempt; it verifies candidate references and all stages, locks the handoff, validates, then activates. Preserve saved production-baseline.json and candidate artifacts; failed onboarding restores only references proven to belong to that batch and refuses an independently advanced publication. Ownership preparation may append freshly observed new-symbol holdings through the existing native ledger with zero execution budgets, matching-account/no-working-order/no-reservation/no-block checks, and no allocation or order creation. A source-verified price path may explicitly report UNAVAILABLE_REFERENCE_PRICE or UNAVAILABLE_MINIMUM_SAMPLES; the informational trade plan then records UNAVAILABLE_PRICE_REFERENCES and omits chronological trades, ending cash and ending holdings. Do not manufacture prices or weaken quote, source, ownership, model or live execution checks. These explicit availability states supersede older instructions requiring numeric estimates for every planning clock.\n\nToday-only exceptions: The user explicitly authorized finishing the already frozen September 14 candidate after 04:00 and manually starting late opening entries before 05:00 Pacific. The source-bound deadline-exception.json expires at 05:00 September 14; it permits only the planning/actuals tail and verified activation, never training new intraday forecasts or submitting orders. The manual Gameplan session can be started by the user with `--late-opening-date 2026-09-14`; recognize this exact optional date and the matching launcher/child identity. It expires at 05:00, retains original forecast identities/target ends and the existing persistent hourly entry-slot claim. Do not replay a consumed slot, start the trader, add this flag to recurring launch commands, or extend these exceptions to another date. All later sessions retain ordinary 04:00 opening preparation and 04:01 entry timing.\n\nManual-start Gameplan behavior approved September 9, 2026: the user starts C:/dev/ducketz/Start-Gameplan-Trader.cmd once. That manual action enables the existing stock controls and selects gameplan-direction-current-market-v1 with --wait-for-open --execute. Do not require another click, confirmation or approval at 04:00. Before the next supported 04:00 Pacific opening, the same bounded worker reports SLEEPING_UNTIL_OPEN, action_date, wakes_at and a fresh heartbeat. It holds the session lock, checks local controls, and performs no broker/order, model-readiness, inventory or entry-slot work while asleep. At wake it reads the current Gameplan and continues automatically; the first normal entry batch is 04:01, and the existing 13:06 transition and 16:59 closing-exit timing remain.\n\nTreat a matching waiting worker as intentional and healthy, not a failed early start. Recognize the exact optional --wait-for-open flag and the selected Gameplan sizing policy in both virtualenv launcher/child commands. Preserve that operator-selected mode and the same session owner. The existing Windows 03:55 launcher can adopt an already-running manual worker instead of launching a duplicate. Its saved default fixed-policy command and schedule remain unchanged when no manual worker exists. Do not activate or start the manual live trader on the user's behalf; the user performs that single initial start.\n\nUnder this explicitly selected Gameplan policy, promoted >=54% bullish forecasts buy using full horizon allocation and actual current cash; <=46% bearish forecasts sell available held shares, with neutral zero. Runtime decisions use current ask for buys and current bid for sales, rounded to cents. The Gameplan price/cash ranges are estimates only: being outside them never blocks, skips, caps, reprices or authorizes an order. Actual cash, actual holdings, pending orders and actual broker fills govern quantities. No projected sale proceeds become spendable cash. Current source/session/ownership and reliable order identity checks still apply.\n\nThe new policy can explicitly record snapshot-bound assignment of unallocated existing stock for a directional sale, without inventing BUY fills or taking another horizon's shares. Actual broker evidence reduces inventory; rejected or cancelled unfilled assigned shares return to unallocated stock with recorded release evidence. Preserve these records, unknown submissions and existing owned holdings. The legacy fixed policy remains separate. Use the updated NIGHTLY_GAMEPLAN.md and INDEPENDENT_STOCK_HORIZONS.md as the current implementation contract; this explicit manual-mode behavior supersedes older statements that all stock execution must be fixed-policy long-only or that starts before 03:55 must fail.\n\nExisting scheduled default and other operating procedures follow. Apply their fixed-policy-only statements to the legacy fixed worker; preserve the explicitly selected manual Gameplan mode described above.\n\nSupervise the Ducketz native independent-horizon stock session from C:\\dev\\ducketz. Read docs\\loops-system-analysis\\INDEPENDENT_STOCK_HORIZONS.md. The Windows Scheduled Task \"Ducketz Independent Stock Session\" now owns the deterministic weekday 03:55 Pacific start through docs\\datafetch-ml\\start_stock_session.ps1; this Codex task supervises its operation rather than being the timed process launcher.\n\nAt the 03:55 wake, inspect that Windows task, its latest launcher.json under C:\\DATASTORE\\logs\\daytime-operations, the matching ml.gameplan_stock_trader process tree, native session lock and state\\independent-stock-trader\\session-status.json. Confirm exactly one owner and preserve it. A Windows virtualenv launcher and child are one process tree. Never launch a duplicate. If the scheduled start is missing or fails, diagnose it as an operational incident before the 04:00 opening, following the repair and supervision rules below.\n\nThe authorized native command remains .\\.venv\\Scripts\\python.exe -u -m ml.gameplan_stock_trader --datastore-target pc --execute --target-horizon all --sizing-policy fixed-horizon-budget-v1 --run-session. The existing stock controls, actual qualified model artifacts and frozen Gameplan, exact symbol/route/source/target contracts, fresh coherent broker evidence, stable account identity, all cash/exposure/order limits, durable entry-slot claims and order identities remain mandatory. Production membership is the authoritative datafetching/watchlist.txt; activate selected research symbols only through the verified onboarding path. The separate 1h/4h/1d/1w holdings use the selected conservative fixed horizon budgets and their existing 1:2:3:4 ceilings; learned enrichment remains research unless independently qualified and is not required by this selected strategy. Never invent profitability evidence or force a trade. Bearish/neutral forecasts are valid no-buy outcomes.\n\nStay with this single bounded session until 17:00 Pacific, inspecting its heartbeat, new stdout/stderr, last-cycle result and receipt evidence at least once a minute. A live PID alone does not establish successful broker operations. DEGRADED, FAILED, repeated read errors, lost ownership or SESSION_FINISHED_WITH_ERRORS require active diagnosis. The native worker now retries complete read-only broker snapshots within a bounded budget, preserving the current entry deadline. Verify that a successful subsequent worker cycle clears an incident; a separate successful diagnostic alone does not prove the worker recovered.\n\nThe user explicitly authorized fixing a broken daytime worker and keeping it operational through 17:00 and on future sessions. Diagnose with read-only account, open-order and quote checks. A timeout is not automatically an authentication failure. Apply focused broker-read, retry, health-reporting or process-supervision repairs with synthetic-broker tests, preserving concurrent changes. If a tested repair requires a restart, verify the exact owner and that no mutation is in flight, preserve all ledgers and entry claims, retain the same authorized command, and verify the replacement process, lock, startup and health evidence. Windows Task Scheduler should remain the native process supervisor. Never clear credentials, delete locks, relax gates, alter models/forecasts or sizing strategy, change controls/risk limits, replay missed entries, repeat uncertain submissions/cancellations, assign manual shares to horizons, or trade options.\n\nBefore changing code or starting/stopping/restarting a process, acquire a fresh UUID through ml.overnight_runtime --claim-supervision using the repository Python. Proceed only on ACQUIRED, renew at least once a minute while repairing, and release when done. BUSY means another operator is repairing; supervise read-only without concurrent changes. Coordinate with Loops Operations Watch. Do not merely append an error and call the task completed while required work remains unhealthy. Keep incident evidence, repair notes and test results under C:\\DATASTORE\\logs\\daytime-operations, and identify any specific external or user-action blocker.\n\nThe native worker owns HH:01 entries, 13:06 after the broker transition, and horizon-owned exits; 17:00-close exits start at 16:59. It never runs overnight or backfills missed entries. Preserve separate horizon ownership, exact target expiry and reconciliation rules. At 17:00 report the actual terminal status, failed/recovered cycles, selected/submitted orders and residual owned inventory. Do not label an unresolved failure as a successful session.\n\nCurrent user-approved Gameplan policy, updated September 14, 2026 evening for new publications: stock direction is bullish at P(up) > 0.50, bearish at P(up) < 0.50, and neutral only at exactly 0.50 (stock-direction-50-v2). The prior 46%-54% neutral band is removed. Preserve older saved forecasts, labels, probabilities and actual results under their original policy. This change adds no model, receipt