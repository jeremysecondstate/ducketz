 N configured symbols, current Gameplans require 24 x N forecasts, 24 x N options-intent rows and 3 x N production OPRA symbol/schema cursors; eleven symbols means 264, 264 and 33. Validate every immutable historical run against its own saved universe. Evaluate a company only in saved plans that actually contain it; pre-onboarding absence is not missing market data. Keep current stock-only preparation, separate 1h/4h/1d/1w contracts and all model and trading gates."
